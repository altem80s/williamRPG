<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Game 1</title>

  <link rel="stylesheet" href="minigamestyle.css">
</head>
<body>

  <h1>Catch 10 ducks</h1>

  <div class="game">
      
      <img src="encouragement.png" class="encouragement" id="encouragement">

    <!-- falling image -->
    <img src="Duckie.png" class="falling" id="falling">

    <!-- catcher -->
    <img src="Basket.png" class="catcher" id="catcher">

    <!-- score -->
    <div class="score" id="score">
      Ducks Collected: 0
    </div>
      
      <div class="popup" id="popup">

  <div class="popup-box">
    <h2>Nice Work!</h2>

    <p>You caught 10 ducks</p>

    <button onclick="window.location.href='nextstep.html'">
      Catch up with Key Guy!
    </button>
  </div>

</div>

  </div>
    <audio id="quack-sound" src="quack.mp3"></audio>
  <script src="minigamescript.js"></script>
</body>
</html>

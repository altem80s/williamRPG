<!-- finalgame.html -->

<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escape Booty Forest</title>

  <link rel="stylesheet" href="finalgame.css">

</head>

<body>

  <h1>Escape Booty Forest</h1>

  <div class="game">

    <!-- PLAYER -->
    <img src="Zestyyy.png" id="player">

    <!-- ENEMY -->
    <img src="epstien.png" id="enemy">

    <!-- FINISH -->
    <div class="finish">
      FINISH
    </div>

    <!-- OBSTACLES -->
   <img src="diddy.png" class="tree tree1">
<img src="skylar.png" class="tree tree2">
<img src="trump.png" class="tree tree3">
<img src="tree.png" class="tree tree4">

    <!-- WIN SCREEN -->
    <div class="popup" id="win-popup">

      <div class="popup-box">

        <h2>You made it home!!</h2>

        <button onclick="location.reload()">
    Play Again
  </button>

  <button onclick="window.location.href='home.html'">
    Take Me Home
  </button>

      </div>

    </div>

    <!-- LOSE SCREEN -->
    <div class="popup" id="lose-popup">

      <div class="popup-box">

        <h2>You Got Raped!</h2>

        <button onclick="location.reload()">
          Try Again
        </button>

      </div>

    </div>

  </div>
    
    <audio id="bg-music" autoplay loop>

  <source src="forestmusic.mp3" type="audio/mpeg">

</audio>

  <script src="finalgame.js"></script>

</body>
</html>
